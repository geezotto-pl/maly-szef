<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF4E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mały Szef">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Mały Szef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E3;--card:#fff;--ink:#3A2E2A;--mut:#8A7A70;--or:#FF7A45;--or2:#FFB38F;--gr:#2FB874;--pu:#7B61FF;--ye:#FFC93C;--line:#F0E0CC;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.big{font-family:"Baloo 2",Nunito,system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{-webkit-user-drag:none;user-select:none}
.hide{display:none!important}
.scr{max-width:560px;margin:0 auto;padding:16px 16px 130px;min-height:100vh;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;background:var(--or);color:#fff;font:800 18px "Baloo 2",Nunito,sans-serif;box-shadow:0 5px 0 #D85A28;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #D85A28}
.btn.gr{background:var(--gr);box-shadow:0 5px 0 #1E8C55}.btn.pu{background:var(--pu);box-shadow:0 5px 0 #5640C9}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.huge{width:100%;padding:18px;font-size:26px;border-radius:26px}
.btn.sm{padding:8px 14px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn img{width:34px;height:34px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line);margin:12px 0}
.mut{color:var(--mut)}.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pill{background:#fff;border-radius:99px;padding:6px 14px;font:800 20px "Baloo 2",sans-serif;box-shadow:0 3px 0 var(--line);display:inline-flex;gap:6px;align-items:center}
.ico-btn{width:48px;height:48px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:24px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
input[type=text],input[type=number]{font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;width:100%}
label.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FFF9F1;margin:6px 0;cursor:pointer}
.seg{display:flex;background:#FFF0DD;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:800}
.seg button.on{background:#fff;box-shadow:0 2px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px 6px 6px;border-radius:99px;background:#FFF0DD;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip img{width:26px;height:26px}
.chip.on{background:var(--or);color:#fff}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:#E4D6C4;position:relative;transition:.2s;flex:0 0 auto;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw:checked{background:var(--gr)}.sw:checked::after{left:23px}

/* awatary dzieci */
.av{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;color:#fff;font:800 17px "Baloo 2",sans-serif}
.av img{width:32px;height:32px;background:#fff;border-radius:50%;padding:2px}
.kidpick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.kidpick button{background:#fff;border-radius:22px;padding:14px 8px;box-shadow:0 4px 0 var(--line);border:4px solid transparent;font:800 20px "Baloo 2",sans-serif}
.kidpick button img{width:70px;height:70px;display:block;margin:0 auto 4px}
.kidpick button.on{border-color:var(--gr);background:#F1FCF5}
.kidcard{border-left:8px solid var(--or)}

/* ekran główny */
.hero{text-align:center;padding:24px 10px 6px}
.hero .chef{width:130px;height:130px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.hero h1{font-size:38px;margin-top:8px;color:var(--or)}
.parent-link{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5}

/* polowanie */
.zones{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zones button{flex:0 0 auto;padding:8px 14px;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--line);font:800 17px "Baloo 2",sans-serif;display:flex;gap:6px;align-items:center}
.zones button.on{background:var(--pu);color:#fff;box-shadow:0 3px 0 #5640C9}
.zones b{background:rgba(0,0,0,.12);border-radius:99px;padding:0 7px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:#fff;border-radius:22px;padding:10px 4px 8px;box-shadow:0 4px 0 var(--line);text-align:center;transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile img{width:76px;height:76px;display:block;margin:0 auto}
.tile .l{font-size:13px;font-weight:700;color:var(--mut);display:block;margin-top:2px;min-height:18px;line-height:1.15}
body.big .tile .l{font-size:15px;color:var(--ink)}
.tile.found{background:#E3F8EC;box-shadow:0 4px 0 #A6E3C2}
.tile.found::after{content:"✔";position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--gr);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.tile.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.15) rotate(4deg)}}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.dock>div{max-width:560px;margin:0 auto}
.progress{height:14px;border-radius:9px;background:#fff;box-shadow:inset 0 2px 0 var(--line);overflow:hidden;margin:4px 0 12px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ye),var(--or));border-radius:9px;transition:width .4s}

/* wybór */
.choices{display:grid;gap:14px}
.dish{display:flex;align-items:center;gap:16px;background:#fff;border-radius:26px;padding:14px;box-shadow:0 5px 0 var(--line);text-align:left;border:4px solid transparent;transition:transform .12s}
.dish img{width:92px;height:92px;flex:0 0 auto}
.dish h3{font-size:23px}
.dish.sel{border-color:var(--gr);transform:scale(1.02);background:#F1FCF5}

/* nagroda */
.reward{text-align:center;padding-top:24px}
.reward .plate{width:190px;height:190px;animation:spin 1s cubic-bezier(.3,1.6,.6,1)}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}}
.reward h1{font-size:42px;color:var(--or)}
.reward h2{font-size:30px;margin:8px 0}
.sticker-new{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 var(--line);margin:14px 0;font:800 20px "Baloo 2",sans-serif}
.sticker-new span{font-size:46px;animation:spin 1s .8s both cubic-bezier(.3,1.6,.6,1)}

/* album */
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.album div{aspect-ratio:1;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 3px 0 var(--line)}
.album div.no{filter:grayscale(1);opacity:.25}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:#fff;border-radius:18px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 var(--line)}
.badge b{font-size:32px}.badge.no{opacity:.35;filter:grayscale(1)}

/* okna */
.modal{position:fixed;inset:0;background:rgba(58,46,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));text-align:center;animation:up .3s cubic-bezier(.2,1.2,.4,1);max-height:94vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet .pic{width:120px;height:120px}
.sheet h2{font-size:30px}
.who{margin:0 0 8px}
.word{font:800 40px "Baloo 2",sans-serif;color:var(--pu)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.opts button{background:#fff;border-radius:20px;padding:14px 4px;box-shadow:0 4px 0 var(--line);font:800 26px "Baloo 2",sans-serif}
.opts.txt{grid-template-columns:1fr}
.opts.letters button{font-size:54px;padding:6px}
.opts.colors button{height:96px;border:6px solid #fff}
.opts button.ok{background:#E3F8EC;outline:5px solid var(--gr)}.opts button.bad{animation:shake .4s;background:#FFE4E0}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0}
.count button img{width:54px;height:54px;opacity:.25;filter:grayscale(1);transition:all .15s}
.count button.on img{opacity:1;filter:none;transform:scale(1.1)}
.numbig{font:800 60px "Baloo 2",sans-serif;color:var(--or);line-height:1}
.explain{background:#fff;border-radius:16px;padding:10px 14px;margin:10px 0;font-weight:700}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:16px 0}
.pin-dots i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--or2)}
.pin-dots i.on{background:var(--or);border-color:var(--or)}
.pin-dots.bad{animation:shake .4s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keypad button{padding:16px 0;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--line);font:800 26px "Baloo 2",sans-serif}

/* rodzic */
.ph{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rlist .ri{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.rlist .ri:last-child{border:0}
.rlist .ri img{width:38px;height:38px;flex:0 0 auto}
.rlist .ri .t{flex:1;min-width:0}
.rlist .ri .t b{display:block;font-size:15px}
details.card summary{font:800 20px "Baloo 2",sans-serif;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▾";color:var(--mut);margin-left:8px}
details[open].card summary::after{content:"▴"}
.recipe li{margin:6px 0}
.have{color:var(--gr);font-weight:800}.miss{color:#D9502F;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-40px;font-style:normal;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:40;animation:fade .2s}
.steps{display:flex;justify-content:center;gap:6px;margin:6px 0 14px}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--line)}.steps i.on{background:var(--or);width:26px;border-radius:9px}
.bigpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bigpick button{background:#fff;border-radius:20px;padding:12px 0;box-shadow:0 4px 0 var(--line);font:800 30px "Baloo 2",sans-serif;border:4px solid transparent}
.bigpick button.on{border-color:var(--or);background:#FFF0E8}
.langpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.langpick button{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);font:800 18px "Baloo 2",sans-serif;border:4px solid transparent;text-align:left}
.langpick button.on{border-color:var(--or);background:#FFF0E8}
.langpick button span{font-size:26px;margin-right:6px}
</style>
</head>
<body>
<section id="setup" class="scr hide"></section>
<section id="home" class="scr hide"></section>
<section id="hunt" class="scr hide">
  <div class="top">
    <button class="ico-btn" id="u-home" aria-label="Wróć">🏠</button>
    <span class="row" style="gap:6px"><span id="u-lead"></span><span class="pill" id="u-stars">⭐ 0</span></span>
    <button class="ico-btn" id="u-say" aria-label="Powtórz polecenie">🔊</button>
  </div>
  <div class="zones" id="u-zones"></div>
  <div class="grid" id="u-grid"></div><div style="height:110px"></div>
  <div class="dock"><div>
    <div class="row" style="justify-content:space-between"><b class="big" style="font-size:18px" id="u-dishes"></b><span class="small mut" id="u-found"></span></div>
    <div class="progress"><i id="u-prog"></i></div>
    <button class="btn gr huge" id="u-done" disabled>🍽️ Gotowe!</button>
  </div></div>
</section>
<section id="approve" class="scr hide"></section>
<section id="choose" class="scr hide">
  <div class="top"><button class="ico-btn" id="c-back" aria-label="Wróć">⬅️</button><span id="c-team"></span><span style="width:48px"></span></div>
  <h1 style="font-size:32px;text-align:center;margin:6px 0 16px" id="c-title">Co dziś zjesz?</h1>
  <div class="choices" id="c-list"></div>
  <div class="dock"><div><button class="btn gr huge" id="c-ok" disabled>✅ To wybieram!</button></div></div>
</section>
<section id="reward" class="scr hide reward"></section>
<section id="album" class="scr hide"></section>
<section id="parent" class="scr hide"></section>
<section id="recipe" class="scr hide"></section>
<div id="modal"></div>

    parts.forEach(([t,l])=>{const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=l.startsWith("pl")?.95:.8;u.pitch=1.1;
      const v=VOICES.find(v=>v.lang.replace("_","-")===l)||VOICES.find(v=>v.lang.slice(0,2)===l.slice(0,2));if(v)u.voice=v;speechSynthesis.speak(u)})}catch(e){}};
  delay?setTimeout(go,delay):go();
}

/* ---------- silnik dopasowania (z „Co z lodówki?”) ---------- */
function daySeed(s){const d=new Date().toISOString().slice(0,10)+s;let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))|0;return (h>>>0)/4294967296}
function allowed(){
  const algIng=new Set(S.alg.flatMap(a=>D.ALG[a]||[]));
  return R.filter(r=>!S.off.includes(r.n)&&r.m.includes(S.meal)&&(!S.maxT||r.t<=S.maxT)&&!(S.noSweet&&S.meal!=="d"&&r.sw)&&!Object.keys(r.i).some(k=>algIng.has(k)));
}
function matches(found){
  const have=new Set([...found,...S.staples]);const now=Date.now();
  return allowed().map(r=>{const req=Object.keys(r.i),miss=req.filter(k=>!have.has(k));
    const days=G.hist[r.n]?(now-G.hist[r.n])/864e5:99;
    const score=miss.length+(days<3?1.5:days<7?.6:0)+daySeed(r.n)*.5;
    return {r,miss,ok:miss.length<=2&&(req.length-miss.length)>=Math.ceil(req.length/2),score}})
   .filter(x=>x.ok).sort((a,b)=>a.score-b.score);
}
function diverse(list,n){const out=[],seen=new Set();
  list.forEach(x=>{if(out.length<n&&!seen.has(x.r.e)){out.push(x);seen.add(x.r.e)}});
  list.forEach(x=>{if(out.length<n&&!out.includes(x))out.push(x)});return out}

function askPin(title,onOk,setMode){
  // okno rysujemy raz; przy wpisywaniu zmieniają się tylko kropki
  let v="",first="";
  $("modal").innerHTML=`<div class="modal"><div class="sheet">
    <h2>${esc(title)}</h2><p class="mut" id="pin-sub">${setMode?"Wymyśl 4 cyfry":"Wpisz PIN rodzica"}</p>
    <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="x">✖️</button><button data-k="0">0</button><button data-k="b">⌫</button></div>
    ${setMode?"":`<p style="margin-top:14px"><button class="small mut" data-k="f" style="text-decoration:underline">Nie pamiętam PIN-u</button></p>`}
  </div></div>`;
  const dots=()=>$("pin-dots").querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on",i<v.length));
  const shake=()=>{const d=$("pin-dots");d.classList.remove("bad");void d.offsetWidth;d.classList.add("bad")};

  $("modal").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(busy)return;buzz(15);snd("tap");
    if(k==="x"){closeModal();return}
    if(k==="f"){forgotPin(onOk);return}
    if(k==="b")v=v.slice(0,-1);else if(v.length<4)v+=k;
    dots();
    if(v.length===4){busy=true;setTimeout(()=>{busy=false;
      if(setMode){
        if(!first){first=v;v="";$("pin-sub").textContent="Wpisz PIN jeszcze raz";dots()}

        else{first="";v="";$("pin-sub").textContent="PIN-y się różnią. Wymyśl 4 cyfry";snd("wrong");shake();dots()}
      }else if(v===S.pin){closeModal();onOk()}
      else{v="";snd("wrong");$("pin-sub").textContent="Zły PIN, spróbuj jeszcze raz";shake();dots()}
    },180)}
  });

/* ---------- MINI-ZADANIA (zawsze o produkcie, który dziecko właśnie znalazło) ---------- */
function miniTask(k){
  const who=TEAM[H.turn%TEAM.length];H.turn++;
  const big=kid(LEADER).level==="big",p=P[k],types=[];
  if(hasLang()&&p[3+LANGS[S.lang][2]-3])types.push(big?"transl":"word");
  if(p[7])types.push("count");
  if(p[2])types.push("color");
  if(big&&p[9])types.push("spell","spell");           // pisownia częściej dla starszych
  if(!big&&!DIGRAPH.test(p[6])&&LETTERS.includes(p[6][0].toUpperCase()))types.push("letter");
  if(!types.length){say(p[0]);return}
  let t=rnd(types);if(t===H.lastType&&types.length>1)t=rnd(types.filter(x=>x!==t));H.lastType=t;
  snd("pop");
  ({word:taskWord,transl:taskTransl,count:taskCount,color:taskColor,spell:taskSpell,letter:taskLetter})[t](k,who);

  <details class="card"><summary>⭐ Zawsze w domu</summary>
    <p class="small mut">Tych produktów dzieci nie szukają. Aplikacja zakłada, że je masz.</p>
    <div class="chips" id="p-staples">${allIng.map(k=>`<button class="chip ${S.staples.includes(k)?"on":""}" data-k="${k}"><img src="${pimg(k)}" alt="" loading="lazy">${esc(P[k][0])}</button>`).join("")}</div>
  </details>

  <details class="card"><summary>⚠️ Alergeny – wyklucz</summary>
    <div class="chips" style="margin-top:10px" id="p-alg">${Object.keys(D.ALG).map(a=>`<button class="chip ${S.alg.includes(a)?"on":""}" data-a="${esc(a)}" style="padding-left:12px">${esc(algNames[a]||a)}</button>`).join("")}</div>
  </details>

  ${Object.entries(grp).map(([g,gn])=>{const rs=R.filter(r=>r.gr===g);return `<details class="card"><summary><span style="flex:1">${gn}</span><span class="mut small">${rs.filter(r=>!S.off.includes(r.n)).length}/${rs.length}</span></summary>
    <div class="row" style="margin:10px 0"><button class="btn sec sm" data-gall="${g}">Włącz wszystkie</button><button class="btn sec sm" data-gnone="${g}">Wyłącz wszystkie</button></div>
    <div class="rlist">${rs.map(r=>`<div class="ri"><img src="${eimg(r.e)}" alt="" loading="lazy"><span class="t"><b data-rec="${esc(r.n)}" style="cursor:pointer">${esc(r.n)}</b><span class="small mut">${r.t} min · ${r.m.split("").map(m=>MEALS[m]?MEALS[m][1]:"").join("")}${r.sw?" · 🍭":""}</span></span><input type="checkbox" class="sw" data-r="${esc(r.n)}" ${S.off.includes(r.n)?"":"checked"}></div>`).join("")}</div></details>`}).join("")}

  <div class="card"><h3 class="ph">⚙️ Inne</h3>
    <div class="row"><button class="btn sec sm" id="p-pin">🔑 Zmień PIN</button><button class="btn sec sm" id="p-reset">🗑️ Wyzeruj naklejki</button></div>
    <p class="small mut" style="margin-top:12px">Mały Szef ${VER} · ${R.length} przepisów · ${Object.keys(P).length} produktów · dane zostają na tym telefonie<br>Ilustracje: Fluent Emoji (Microsoft, MIT)</p>
  </div>`;
  show("parent");
  const P_=$("parent");
  const seg=(id,key,num)=>P_.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{S[key]=num?+b.dataset.v:b.dataset.v;save();renderParentKeep()});
  seg("p-meal","meal");seg("p-time","maxT",1);seg("p-n","n",1);
  bindLang(renderParentKeep);
  $("p-sweet").onchange=e=>{S.noSweet=e.target.checked;save();renderParentKeep()};
  $("p-appr").onchange=e=>{S.approve=e.target.checked;save()};
  $("p-voice").onchange=e=>{S.voice=e.target.checked;save()};
  $("p-sound").onchange=e=>{S.sound=e.target.checked;save();snd("found")};
  P_.querySelectorAll("[data-name]").forEach(i=>i.onchange=()=>{S.kids[+i.dataset.name].name=i.value.trim();save()});
  P_.querySelectorAll("[data-girl] button,[data-level] button").forEach(b=>b.onclick=()=>{const p=b.parentElement;
    if(p.dataset.girl)S.kids[+p.dataset.girl].girl=b.dataset.v==="1";else S.kids[+p.dataset.level].level=b.dataset.v;save();renderParentKeep()});
  P_.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>ask(`Usunąć ${S.kids[+b.dataset.del].name||"dziecko"}?`,"Usuń",()=>{S.kids.splice(+b.dataset.del,1);save();renderParentKeep()}));
  if($("p-addkid"))$("p-addkid").onclick=()=>{S.kids.push({name:"",girl:false,level:"small"});save();renderParentKeep()};
  P_.querySelectorAll("[data-zone]").forEach(c=>c.onchange=()=>{S.zones=[...P_.querySelectorAll("[data-zone]:checked")].map(x=>x.dataset.zone);save()});
  P_.querySelectorAll("#p-staples .chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.staples=S.staples.includes(k)?S.staples.filter(x=>x!==k):[...S.staples,k];b.classList.toggle("on");save()});
  const cnt=()=>$("p-cnt").innerHTML=`Pasujących dań: <b>${allowed().length}</b>`;
  P_.querySelectorAll("#p-alg .chip").forEach(b=>b.onclick=()=>{const a=b.dataset.a;S.alg=S.alg.includes(a)?S.alg.filter(x=>x!==a):[...S.alg,a];b.classList.toggle("on");save();cnt()});
  P_.querySelectorAll("[data-r]").forEach(c=>c.onchange=()=>{const n=c.dataset.r;S.off=c.checked?S.off.filter(x=>x!==n):[...S.off,n];save();cnt()});
  P_.querySelectorAll("[data-gall]").forEach(b=>b.onclick=()=>{const ns=R.filter(r=>r.gr===b.dataset.gall).map(r=>r.n);S.off=S.off.filter(x=>!ns.includes(x));save();renderParentKeep()});
  P_.querySelectorAll("[data-gnone]").forEach(b=>b.onclick=()=>{const ns=R.filter(r=>r.gr===b.dataset.gnone).map(r=>r.n);S.off=[...new Set([...S.off,...ns])];save();renderParentKeep()});
  P_.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>renderRecipe(R.find(r=>r.n===b.dataset.rec),"parent"));
  $("p-pin").onclick=()=>askPin("Nowy PIN",()=>toast("PIN zmieniony"),true);
  $("p-reset").onclick=()=>ask("Wyzerować naklejki, gwiazdki i słówka?","Wyzeruj",()=>{G={stars:0,stickers:[],words:[],hunts:0,team:0,hist:G.hist};save();toast("Wyzerowano")});
  $("p-back").onclick=()=>{if(S.kids.some(k=>!k.name)){toast("Wpisz imię każdego dziecka");return}goHome()};
}
function renderParentKeep(){
  const open=[...document.querySelectorAll("#parent details")].map(d=>d.open),y=window.scrollY;
  renderParent();document.querySelectorAll("#parent details").forEach((d,i)=>d.open=open[i]);window.scrollTo(0,y);
}

/* ---------- start ---------- */
if(!S.setupDone||!S.pin||!S.kids.length){show("setup");renderSetup()}else goHome();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
